<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"
    />
    <title>Put.io Manager</title>
    <link rel="stylesheet" href="heroicons.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="shell">
      <div class="app-header">
        <strong class="brand">Put.io Manager</strong>
        <div class="header-status">
          <span id="engine-status" role="status" aria-live="polite"></span>
          <span id="account-status" role="status" aria-live="polite"></span>
        </div>
      </div>
      <nav id="navigation" aria-label="Views"></nav>
      <div id="actions" class="actions" aria-label="Current view actions"></div>
    </header>
    <main>
      <div id="notice" role="status" aria-live="polite"></div>
      <section id="view"></section>
    </main>
    <dialog id="dialog">
      <form id="dialog-form">
        <h2 id="dialog-title"></h2>
        <div id="dialog-fields"></div>
        <p id="dialog-error" role="alert"></p>
        <footer>
          <button type="button" id="dialog-cancel">Cancel</button
          ><button type="submit" id="dialog-submit">OK</button>
        </footer>
      </form>
    </dialog>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
