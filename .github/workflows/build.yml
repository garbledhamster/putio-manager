name: Build native downloads
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.sha || 'latest' }}
  cancel-in-progress: true
jobs:
  installer-tracer:
    name: Windows servicing tracer (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Verify generated Windows servicing before full application packaging
        run: node scripts/windows-installer/native-fixture.mjs --disposable-ci
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-11-arm, macos-15-intel, macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: 8.0.x
      - name: Install Linux archive inspection tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y squashfs-tools libfuse2t64
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run verify:public
      - name: Materialize the native Electron runtime
        run: node node_modules/electron/install.js
      - name: Configure Linux test sandbox
        if: runner.os == 'Linux'
        run: sudo chown root:root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: node --test tests/release-pipeline.test.mjs tests/release-privacy.test.mjs tests/release-publication.test.mjs
      - run: npm run test:ui-assets
      - run: xvfb-run -a npm run test:ui
        if: runner.os == 'Linux'
      - run: npm run test:ui
        if: runner.os != 'Linux'
      - name: Build pinned Mac update helper
        if: runner.os == 'macOS'
        run: node scripts/macos-updater/build.mjs
      - run: npm run package
      - name: Stage native updater runtime and public configuration
        run: node scripts/stage-native-updater.mjs
      - name: Configure packaged Linux test sandbox
        if: runner.os == 'Linux'
        run: sudo chown root:root release/PutioManager-linux-*/chrome-sandbox && sudo chmod 4755 release/PutioManager-linux-*/chrome-sandbox
      - run: xvfb-run -a npm run test:package
        if: runner.os == 'Linux'
      - run: npm run test:package
        if: runner.os != 'Linux'
      - run: npm run package:distribution
      - run: npm run test:distribution
      - name: Configure distributed Linux test sandbox
        if: runner.os == 'Linux'
        run: sudo chown root:root release/PutioManager-linux-*-distribution/desktop/chrome-sandbox && sudo chmod 4755 release/PutioManager-linux-*-distribution/desktop/chrome-sandbox
      - run: xvfb-run -a npm run test:distribution:gui
        if: runner.os == 'Linux'
      - run: npm run test:distribution:gui
        if: runner.os != 'Linux'
      - name: Audit distribution contents
        shell: bash
        run: |
          bundle=(release/*-distribution)
          test "${#bundle[@]}" -eq 1
          node scripts/verify-public-release.mjs artifact "${bundle[0]}"
      - run: npm run release:archive
      - name: Audit exact download archive
        shell: bash
        run: |
          archives=(release-assets/PutioManager-*)
          test "${#archives[@]}" -eq 1
          node scripts/verify-public-release.mjs artifact "${archives[0]}"
      - name: Build and inspect both Windows installer formats
        if: runner.os == 'Windows'
        run: node scripts/windows-installer/build.mjs
      - name: Independently inspect the final Windows payloads
        if: runner.os == 'Windows'
        run: node scripts/windows-installer/audit.mjs
      - name: Verify Windows install, mixed-format update, rollback and uninstall
        if: runner.os == 'Windows'
        run: node scripts/windows-installer/native-fixture.mjs --disposable-ci
      - name: Verify actual Windows updater, engine shutdown and installed version
        if: runner.os == 'Windows'
        run: node scripts/windows-installer/native-update-test.mjs --disposable-ci
      - name: Package Mac app-only update
        if: runner.os == 'macOS'
        run: node scripts/macos-updater/package.mjs
      - name: Inspect exact Mac update archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          archives=(release-assets/*-update.zip)
          test "${#archives[@]}" -eq 1
          node scripts/verify-public-release.mjs app "${archives[0]}" --platform darwin
      - name: Verify Mac native update, signature rejection and profile preservation
        if: runner.os == 'macOS'
        run: node scripts/macos-updater/native-upgrade-test.mjs
      - name: Package Linux AppImage without publishing
        if: runner.os == 'Linux'
        run: node scripts/linux-updater/build.mjs
      - name: Inspect exact AppImage without executing it
        if: runner.os == 'Linux'
        shell: bash
        run: |
          images=(release-assets/*.AppImage)
          test "${#images[@]}" -eq 1
          node scripts/linux-updater/audit.mjs "${images[0]}"
      - name: Verify real Linux AppImage update and profile preservation
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/linux-updater/native-upgrade-test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: |
            release-assets/PutioManager-*
            release-assets/latest-linux*.yml
          if-no-files-found: error
          retention-days: 14
  assemble:
    needs: [native, installer-tracer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - name: Fetch verified corresponding installer source once
        run: node scripts/release-catalog.mjs fetch-wix-source
      - run: node scripts/release-catalog.mjs verify release-assets build
      - run: npm run release:checksums
      - run: npm run release:checksums -- --verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-release-bundle
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

